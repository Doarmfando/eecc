[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "eecc-pdf-worker"
version = "0.1.0"
description = "Núcleo de extracción de estados de cuenta bancarios"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Proyecto EECC" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11,<1"]
excel = ["openpyxl>=3.1,<4"]
api = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]
queue = ["celery[redis]>=5.4,<6"]
dev = [
  "mypy>=1.15,<2",
  "pandas>=2.2,<4",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "reportlab>=4.2,<5",
  "ruff>=0.11,<1",
  "tqdm>=4.66,<5",
  "types-openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["statement_worker"]
omit = ["*/domain/protocols.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:typings"
packages = ["statement_worker"]

# Celery no publica tipos; el adaptador de cola es la única capa que lo toca.
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

# Sin tipos de Celery, su decorador de tareas es opaco para mypy.
[[tool.mypy.overrides]]
module = ["statement_worker.tasks.*"]
disallow_untyped_decorators = false
